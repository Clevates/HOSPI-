<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Inscription - HOSPI+</title>
</head>
<body class="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 relative font-sans">

    <!-- Bouton Retour à l'accueil -->
    <a href="index.html" class="absolute top-6 left-6 text-slate-400 hover:text-cyan-400 transition flex items-center gap-2 text-lg font-medium">
        <i class="bi bi-arrow-left"></i> Retour à l'accueil
    </a>

    <!-- Carte d'inscription -->
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-cyan-900/20 mt-10 sm:mt-0">
        
        <!-- Logo -->
        <div class="flex items-center gap-5 mb-10">
            <div class="flex items-center justify-center w-16 h-16 bg-slate-800 border border-cyan-500/50 rounded-2xl shadow-inner shadow-cyan-500/20">
                <i class="bi bi-hospital-fill text-3xl text-cyan-400"></i>
            </div>
            <div>
                <h1 class="text-3xl text-white font-bold tracking-tight">HOSPI<span class="text-cyan-500">+</span></h1>
                <p class="text-slate-400 text-sm">Créez votre espace personnel</p>
            </div>
        </div>

        <!-- Formulaire -->
        <form action="#" method="POST" class="space-y-5">
            
            <!-- Nom d'utilisateur -->
            <div class="flex flex-col gap-2">
                <label for="user-name" class="text-sm text-slate-300 font-semibold ml-1">Nom d'utilisateur</label>
                <div class="relative">
                    <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input type="text" name="user-name" id="user-name" placeholder="ex: Jean Dupont" required
                        class="w-full h-12 bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl pl-12 pr-5 text-white outline-none transition placeholder-slate-500">
                </div>
            </div>

            <!-- Email -->
            <div class="flex flex-col gap-2">
                <label for="email" class="text-sm text-slate-300 font-semibold ml-1">Adresse Email</label>
                <div class="relative">
                    <i class="bi bi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input type="email" name="email" id="email" placeholder="jean.dupont@email.com" required
                        class="w-full h-12 bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl pl-12 pr-5 text-white outline-none transition placeholder-slate-500">
                </div>
            </div>

            <!-- Numéro de téléphone -->
            <div class="flex flex-col gap-2">
                <label for="phone" class="text-sm text-slate-300 font-semibold ml-1">Numéro de téléphone</label>
                <div class="relative">
                    <i class="bi bi-telephone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input type="tel" name="phone" id="phone" placeholder="+225 05 12 34 56 78" required
                        class="w-full h-12 bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl pl-12 pr-5 text-white outline-none transition placeholder-slate-500">
                </div>
            </div>

            <!-- Mot de passe (Ajout recommandé) -->
            <div class="flex flex-col gap-2">
                <label for="password" class="text-sm text-slate-300 font-semibold ml-1">Mot de passe</label>
                <div class="relative">
                    <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required
                        class="w-full h-12 bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl pl-12 pr-5 text-white outline-none transition placeholder-slate-500">
                </div>
            </div>

            <!-- Bouton de soumission -->
            <button type="submit" 
                class="w-full h-12 mt-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/25 transition-all active:scale-[0.98]">
                Créer mon compte
            </button>
        </form>

        <!-- Lien de connexion -->
        <p class="mt-8 text-center text-sm text-slate-400">
            Vous avez déjà un compte ? 
            <a href="se connecter.html" class="text-cyan-400 font-semibold hover:underline">Connectez-vous</a>
        </p>

    </div>

</body>
</html>
